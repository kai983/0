name: Build Android APK

on:
  push:
    branches:
      - claude/build-app-l9noeq
    paths:
      - 'client/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install web app dependencies
        working-directory: client
        run: npm ci

      - name: Build web app
        working-directory: client
        run: npm run build

      - name: Sync Capacitor Android project
        working-directory: client
        run: npx cap sync android

      - name: Grant execute permission to gradlew
        working-directory: client/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: client/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Read app version
        id: version
        run: echo "value=$(node -p "require('./client/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-archive-${{ steps.version.outputs.value }}-apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK as a GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          # One release per version. Re-running the same version replaces its asset
          # instead of failing on an existing tag.
          cp client/android/app/build/outputs/apk/debug/app-debug.apk "knowledge-archive-$VERSION.apk"
          if gh release view "v$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "knowledge-archive-$VERSION.apk" \
              --repo "${{ github.repository }}" --clobber
          else
            gh release create "v$VERSION" "knowledge-archive-$VERSION.apk" \
              --repo "${{ github.repository }}" \
              --title "지식 아카이브 v$VERSION" \
              --notes "커밋: ${{ github.sha }}" \
              --prerelease
          fi
