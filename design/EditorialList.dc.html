<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;900&amp;display=swap">
  <style>
    body { margin: 0; font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; word-break: keep-all; }
    a { color: #b04a2f; } a:hover { color: #8f3a23; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #faf7f2; display: flex; flex-direction: column; box-sizing: border-box;">

  <div style="padding: 18px 24px 0;">
    <div style="width: 28px; height: 4px; background: #b04a2f;"></div>
    <div style="display: flex; align-items: baseline; justify-content: space-between; margin-top: 12px;">
      <div style="font-family: 'Noto Serif KR', 'Apple SD Gothic Neo', serif; font-size: 26px; font-weight: 900; color: #1f1b16; letter-spacing: -0.01em;">저장소</div>
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="font-size: 11px; font-weight: 600; color: #6e675d; letter-spacing: 0.08em;">24 ITEMS</div>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6e675d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 4.5v1.8M12 17.7v1.8M19.5 12h-1.8M6.3 12H4.5M17.3 6.7l-1.3 1.3M8 16l-1.3 1.3M17.3 17.3L16 16M8 8L6.7 6.7"/></svg>
      </div>
    </div>
  </div>

  <div style="padding: 14px 24px 0;">
    <div style="height: 42px; border-bottom: 1px solid #d8d1c5; display: flex; align-items: center; gap: 10px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#a09a90" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
      <div style="font-size: 15px; color: #a09a90;">무엇을 찾으세요?</div>
    </div>
  </div>

  <div style="padding: 16px 24px 4px; display: flex; gap: 18px; overflow: hidden;">
    <div style="padding-bottom: 6px; border-bottom: 2px solid #b04a2f; color: #1f1b16; font-size: 13px; font-weight: 600; white-space: nowrap;">전체</div>
    <div style="padding-bottom: 6px; border-bottom: 2px solid transparent; color: #a09a90; font-size: 13px; font-weight: 500; white-space: nowrap;">생산성</div>
    <div style="padding-bottom: 6px; border-bottom: 2px solid transparent; color: #a09a90; font-size: 13px; font-weight: 500; white-space: nowrap;">지식관리</div>
    <div style="padding-bottom: 6px; border-bottom: 2px solid transparent; color: #a09a90; font-size: 13px; font-weight: 500; white-space: nowrap;">뇌과학</div>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 4px 24px 0; display: flex; flex-direction: column;">

    <div style="padding: 20px 0; border-bottom: 1px solid #e5dfd5; display: flex; flex-direction: column; gap: 8px;">
      <div style="font-size: 11px; font-weight: 600; color: #6e675d; letter-spacing: 0.08em;">유튜브 - 어제</div>
      <div style="font-family: 'Noto Serif KR', 'Apple SD Gothic Neo', serif; font-size: 19px; font-weight: 600; color: #1f1b16; line-height: 1.5;">뇌는 현실을 그대로 보지 않는다</div>
      <div style="font-size: 14px; color: #6e675d; line-height: 1.65;">생존에 유리하도록 감각 정보를 미세하게 왜곡해 받아들인다.</div>
      <div style="font-size: 12px; color: #a09a90; letter-spacing: 0.02em;">뇌과학 - 인지</div>
    </div>

    <div style="padding: 20px 0; border-bottom: 1px solid #e5dfd5; display: flex; flex-direction: column; gap: 8px;">
      <div style="font-size: 11px; font-weight: 600; color: #6e675d; letter-spacing: 0.08em;">기사 - 3일 전</div>
      <div style="font-family: 'Noto Serif KR', 'Apple SD Gothic Neo', serif; font-size: 19px; font-weight: 600; color: #1f1b16; line-height: 1.5;">제텔카스텐, 링크가 만드는 맥락</div>
      <div style="font-size: 14px; color: #6e675d; line-height: 1.65;">영구 노트는 하나의 생각만 담고, 연결로 의미를 만든다.</div>
      <div style="font-size: 12px; color: #a09a90; letter-spacing: 0.02em;">지식관리</div>
    </div>

    <div style="padding: 20px 0; border-bottom: 1px solid #e5dfd5; display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; align-items: center; gap: 6px;">
        <div style="width: 14px; height: 14px; border-radius: 4px; background: linear-gradient(135deg, #4593ff, #5b5ff0); display: flex; align-items: center; justify-content: center;">
          <svg width="9" height="9" viewBox="0 0 24 24" fill="#fff"><path d="M12 3l2.1 6.2L20 11l-5.9 1.8L12 19l-2.1-6.2L4 11l5.9-1.8z"/></svg>
        </div>
        <div style="font-size: 11px; font-weight: 600; color: #5b5ff0; letter-spacing: 0.08em;">요약하는 중</div>
      </div>
      <div style="font-family: 'Noto Serif KR', 'Apple SD Gothic Neo', serif; font-size: 19px; font-weight: 600; color: #1f1b16; line-height: 1.5;">딥워크: 몰입의 기술</div>
      <div style="height: 2px; background: #eae4d9; overflow: hidden;">
        <div style="width: 62%; height: 100%; background: linear-gradient(90deg, #4593ff, #5b5ff0);"></div>
      </div>
    </div>

    <div style="padding: 20px 0; display: flex; flex-direction: column; gap: 8px;">
      <div style="font-size: 11px; font-weight: 600; color: #6e675d; letter-spacing: 0.08em;">메모 - 지난주</div>
      <div style="font-family: 'Noto Serif KR', 'Apple SD Gothic Neo', serif; font-size: 19px; font-weight: 600; color: #1f1b16; line-height: 1.5;">인터뷰: 창업가의 시간 관리</div>
      <div style="font-size: 14px; color: #6e675d; line-height: 1.65;">위임으로 시간을 만들고 남은 시간을 블록으로 보호한다.</div>
      <div style="font-size: 12px; color: #a09a90; letter-spacing: 0.02em;">생산성</div>
    </div>

  </div>

  <div style="border-top: 1px solid #e5dfd5; padding: 10px 0 26px; display: flex; background: #faf7f2;">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#b04a2f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8a2 2 0 0 1 2 2v13.2a1 1 0 0 1-1.5.86L12 17.4l-4.5 2.66A1 1 0 0 1 6 19.2V6a2 2 0 0 1 2-2z"/></svg>
      <div style="font-size: 11px; font-weight: 600; color: #b04a2f;">저장소</div>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; position: relative;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#a09a90" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="14" height="13" rx="2.5"/><path d="M8 3h10a3 3 0 0 1 3 3v10"/></svg>
      <div style="position: absolute; top: -3px; left: 50%; margin-left: 5px; min-width: 17px; height: 17px; border-radius: 999px; background: #b04a2f; color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 4px; box-sizing: border-box;">7</div>
      <div style="font-size: 11px; font-weight: 500; color: #a09a90;">학습</div>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#a09a90" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <div style="font-size: 11px; font-weight: 500; color: #a09a90;">새 지식</div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
