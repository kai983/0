<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; }
    a { color: #ecae52; } a:hover { color: #f3c37a; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #0b0c0e; display: flex; flex-direction: column; box-sizing: border-box; position: relative;">

  <div style="position: absolute; top: 0; left: 0; right: 0; height: 300px; background: radial-gradient(circle at 50% 0%, rgba(236, 174, 82, 0.14), transparent 65%); pointer-events: none;"></div>

  <div style="padding: 10px 8px 10px 12px; display: flex; align-items: center; justify-content: space-between; position: relative;">
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#edeff3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </div>
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#9ba1ac" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5.5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="18.5" r="1.6"/></svg>
    </div>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 10px 20px 0; position: relative;">

    <div style="font-size: 21px; font-weight: 600; color: #edeff3; line-height: 1.45; letter-spacing: -0.01em;">뇌는 현실을 그대로 보지 않는다</div>
    <div style="display: flex; align-items: center; gap: 7px; margin-top: 10px;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="#ecae52"><path d="M9.6 15.6V8.4l6.3 3.6z"/><rect x="2" y="4" width="20" height="16" rx="4.4" fill="none" stroke="#ecae52" stroke-width="2"/></svg>
      <div style="font-size: 13px; color: #9ba1ac;">유튜브 - 12분 - 2026. 9. 1.</div>
    </div>

    <div style="display: flex; gap: 6px; margin-top: 14px;">
      <div style="padding: 4px 11px; border-radius: 999px; background: rgba(255, 255, 255, 0.08); color: rgba(255, 255, 255, 0.75); font-size: 12px; font-weight: 500;">뇌과학</div>
      <div style="padding: 4px 11px; border-radius: 999px; background: rgba(255, 255, 255, 0.08); color: rgba(255, 255, 255, 0.75); font-size: 12px; font-weight: 500;">인지</div>
      <div style="padding: 4px 11px; border-radius: 999px; border: 1px dashed rgba(255, 255, 255, 0.12); color: #5c616b; font-size: 12px; font-weight: 500;">+ 태그</div>
    </div>

    <div style="background: #141519; border-radius: 16px; padding: 18px 18px 20px; margin-top: 20px;">
      <div style="display: flex; align-items: center; gap: 7px; margin-bottom: 12px;">
        <div style="width: 18px; height: 18px; border-radius: 5px; background: linear-gradient(135deg, #4593ff, #5b5ff0); display: flex; align-items: center; justify-content: center;">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="#fff"><path d="M12 3l2.1 6.2L20 11l-5.9 1.8L12 19l-2.1-6.2L4 11l5.9-1.8z"/></svg>
        </div>
        <div style="font-size: 13px; font-weight: 600; color: #9a9dff; letter-spacing: -0.01em;">AI 요약</div>
      </div>

      <div style="font-size: 16.5px; font-weight: 600; color: #edeff3; line-height: 1.65; letter-spacing: -0.01em;">뇌는 카메라가 아니라, 생존에 유리하도록 감각을 미세하게 왜곡하는 예측 기계다.</div>

      <div style="font-size: 12px; font-weight: 600; color: #5c616b; letter-spacing: 0.04em; margin: 20px 0 10px;">핵심 내용</div>

      <div style="display: flex; flex-direction: column; gap: 14px;">
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <div style="font-size: 15px; font-weight: 600; color: #edeff3; line-height: 1.5;">뇌의 현실 왜곡</div>
          <div style="font-size: 15px; color: #c3c8d2; line-height: 1.75;">모든 사람이 1~2%의 왜곡을 가지고 살아간다. 약간의 과장은 오히려 사회적 적응에 도움이 된다.</div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <div style="font-size: 15px; font-weight: 600; color: #edeff3; line-height: 1.5;">감각 오차 조절기</div>
          <div style="font-size: 15px; color: #c3c8d2; line-height: 1.75;">노르에피네프린과 주의집중으로 조절된다. 위험 상황에서는 오차가 커도 일단 피하는 편이 생존에 유리하다.</div>
        </div>
      </div>
    </div>

  </div>

  <div style="padding: 14px 20px 26px; background: #0b0c0e; position: relative;">
    <div style="display: flex; gap: 8px;">
      <div style="flex: 1.4; height: 54px; border-radius: 12px; background: #ecae52; color: #0b0c0e; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 7px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#0b0c0e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="14" height="13" rx="2.5"/><path d="M8 3h10a3 3 0 0 1 3 3v10"/></svg>
        학습 카드 만들기
      </div>
      <div style="flex: 1; height: 54px; border-radius: 12px; background: #1a1c21; color: #c3c8d2; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center;">저장소로</div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
