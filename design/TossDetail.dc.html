<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; }
    a { color: #3182f6; } a:hover { color: #1b64da; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #ffffff; display: flex; flex-direction: column; box-sizing: border-box;">

  <div style="padding: 10px 8px 10px 12px; display: flex; align-items: center; justify-content: space-between;">
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#191f28" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </div>
    <div style="display: flex; gap: 2px;">
      <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8b95a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5.5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="18.5" r="1.6"/></svg>
      </div>
    </div>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 8px 20px 0;">

    <div style="font-size: 22px; font-weight: 700; color: #191f28; line-height: 1.4; letter-spacing: -0.02em;">뇌는 현실을 그대로 보지 않는다</div>
    <div style="display: flex; align-items: center; gap: 7px; margin-top: 10px;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="#f04452"><path d="M9.6 15.6V8.4l6.3 3.6z"/><rect x="2" y="4" width="20" height="16" rx="4.4" fill="none" stroke="#f04452" stroke-width="2"/></svg>
      <div style="font-size: 13px; color: #8b95a1;">유튜브 - 12분 - 2026. 9. 1.</div>
    </div>

    <div style="display: flex; gap: 6px; margin-top: 14px;">
      <div style="padding: 4px 9px; border-radius: 6px; background: #f2f4f6; color: #4e5968; font-size: 12px; font-weight: 500;">뇌과학</div>
      <div style="padding: 4px 9px; border-radius: 6px; background: #f2f4f6; color: #4e5968; font-size: 12px; font-weight: 500;">인지</div>
      <div style="padding: 4px 9px; border-radius: 6px; border: 1px dashed #dde2e7; color: #b0b8c1; font-size: 12px; font-weight: 500;">+ 태그</div>
    </div>

    <div style="height: 12px;"></div>

    <div style="background: #f9fafb; border-radius: 20px; padding: 18px 18px 20px; margin-top: 10px;">
      <div style="display: flex; align-items: center; gap: 7px; margin-bottom: 12px;">
        <div style="width: 18px; height: 18px; border-radius: 5px; background: linear-gradient(135deg, #4593ff, #5b5ff0); display: flex; align-items: center; justify-content: center;">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="#fff"><path d="M12 3l2.1 6.2L20 11l-5.9 1.8L12 19l-2.1-6.2L4 11l5.9-1.8z"/></svg>
        </div>
        <div style="font-size: 13px; font-weight: 700; color: #5b5ff0; letter-spacing: -0.01em;">AI 요약</div>
      </div>

      <div style="font-size: 17px; font-weight: 700; color: #191f28; line-height: 1.6; letter-spacing: -0.02em;">뇌는 카메라가 아니라, 생존에 유리하도록 감각을 미세하게 왜곡하는 예측 기계다.</div>

      <div style="font-size: 13px; font-weight: 600; color: #8b95a1; letter-spacing: 0.02em; margin: 20px 0 10px;">핵심 내용</div>

      <div style="display: flex; flex-direction: column; gap: 14px;">
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <div style="font-size: 15px; font-weight: 700; color: #191f28; line-height: 1.5;">뇌의 현실 왜곡</div>
          <div style="font-size: 15px; color: #333d4b; line-height: 1.7;">모든 사람이 1~2%의 왜곡을 가지고 살아간다. 약간의 과장은 오히려 사회적 적응에 도움이 된다.</div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <div style="font-size: 15px; font-weight: 700; color: #191f28; line-height: 1.5;">감각 오차 조절기</div>
          <div style="font-size: 15px; color: #333d4b; line-height: 1.7;">노르에피네프린과 주의집중으로 조절된다. 위험 상황에서는 오차가 커도 일단 피하는 편이 생존에 유리하다.</div>
        </div>
      </div>
    </div>

  </div>

  <div style="padding: 14px 20px 26px; background: #fff;">
    <div style="display: flex; gap: 8px;">
      <div style="flex: 1.4; height: 56px; border-radius: 16px; background: #3182f6; color: #fff; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 7px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="14" height="13" rx="2.5"/><path d="M8 3h10a3 3 0 0 1 3 3v10"/></svg>
        학습 카드 만들기
      </div>
      <div style="flex: 1; height: 56px; border-radius: 16px; background: #f2f4f6; color: #4e5968; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center;">저장소로</div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
