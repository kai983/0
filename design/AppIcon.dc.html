<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; }
    a { color: #3182f6; } a:hover { color: #1b64da; }
  </style>
</helmet>
<div style="width: 880px; height: 620px; background: #ffffff; padding: 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px;">

  <div style="display: flex; flex-direction: column; gap: 4px;">
    <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: #3182f6;">LAUNCHER ICON</div>
    <div style="font-size: 20px; font-weight: 700; color: #191f28; letter-spacing: -0.02em;">책갈피 - 저장한다는 행동을 그대로</div>
    <div style="font-size: 13px; color: #8b95a1; line-height: 1.5;">채워진 단일 형태 + 같은 계열 그라디언트. 안드로이드 66dp 안전 영역 안에 들어가고, 단색으로 축소해도 형태가 남습니다.</div>
  </div>

  <div style="display: flex; gap: 40px; align-items: flex-start;">

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="font-size: 11px; font-weight: 700; color: #8b95a1; letter-spacing: 0.08em;">A - 책갈피 (권장)</div>
      <div style="display: flex; gap: 12px;">
        <svg width="132" height="132" viewBox="0 0 108 108">
          <defs>
            <linearGradient id="gA" x1="0" y1="0" x2="0.65" y2="1">
              <stop offset="0" stop-color="#4593ff"/>
              <stop offset="1" stop-color="#5b5ff0"/>
            </linearGradient>
            <clipPath id="mA"><rect x="0" y="0" width="108" height="108" rx="26"/></clipPath>
          </defs>
          <g clip-path="url(#mA)">
            <rect x="0" y="0" width="108" height="108" fill="url(#gA)"/>
            <path d="M38 29h32a5 5 0 0 1 5 5v45.6a2.4 2.4 0 0 1-3.7 2l-15.6-9.9a3.2 3.2 0 0 0-3.4 0l-15.6 9.9a2.4 2.4 0 0 1-3.7-2V34a5 5 0 0 1 5-5z" fill="#ffffff"/>
            <rect x="43" y="40" width="22" height="4.6" rx="2.3" fill="#5b5ff0" opacity="0.32"/>
            <rect x="43" y="50" width="15" height="4.6" rx="2.3" fill="#5b5ff0" opacity="0.32"/>
          </g>
        </svg>
        <svg width="132" height="132" viewBox="0 0 108 108">
          <defs><clipPath id="mAc"><circle cx="54" cy="54" r="54"/></clipPath></defs>
          <g clip-path="url(#mAc)">
            <rect x="0" y="0" width="108" height="108" fill="url(#gA)"/>
            <path d="M38 29h32a5 5 0 0 1 5 5v45.6a2.4 2.4 0 0 1-3.7 2l-15.6-9.9a3.2 3.2 0 0 0-3.4 0l-15.6 9.9a2.4 2.4 0 0 1-3.7-2V34a5 5 0 0 1 5-5z" fill="#ffffff"/>
            <rect x="43" y="40" width="22" height="4.6" rx="2.3" fill="#5b5ff0" opacity="0.32"/>
            <rect x="43" y="50" width="15" height="4.6" rx="2.3" fill="#5b5ff0" opacity="0.32"/>
          </g>
        </svg>
      </div>
      <div style="font-size: 12px; color: #8b95a1;">스퀘어클 / 원형 마스크</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="font-size: 11px; font-weight: 700; color: #8b95a1; letter-spacing: 0.08em;">B - 쌓인 층</div>
      <div style="display: flex; gap: 12px;">
        <svg width="132" height="132" viewBox="0 0 108 108">
          <defs>
            <linearGradient id="gB" x1="0" y1="0" x2="0.65" y2="1">
              <stop offset="0" stop-color="#4593ff"/>
              <stop offset="1" stop-color="#5b5ff0"/>
            </linearGradient>
            <clipPath id="mB"><rect x="0" y="0" width="108" height="108" rx="26"/></clipPath>
          </defs>
          <g clip-path="url(#mB)">
            <rect x="0" y="0" width="108" height="108" fill="url(#gB)"/>
            <rect x="31" y="58" width="46" height="10" rx="5" fill="#ffffff" opacity="0.45"/>
            <rect x="34" y="45" width="40" height="10" rx="5" fill="#ffffff" opacity="0.7"/>
            <rect x="37" y="32" width="34" height="10" rx="5" fill="#ffffff"/>
          </g>
        </svg>
        <svg width="132" height="132" viewBox="0 0 108 108">
          <defs><clipPath id="mBc"><circle cx="54" cy="54" r="54"/></clipPath></defs>
          <g clip-path="url(#mBc)">
            <rect x="0" y="0" width="108" height="108" fill="url(#gB)"/>
            <rect x="31" y="58" width="46" height="10" rx="5" fill="#ffffff" opacity="0.45"/>
            <rect x="34" y="45" width="40" height="10" rx="5" fill="#ffffff" opacity="0.7"/>
            <rect x="37" y="32" width="34" height="10" rx="5" fill="#ffffff"/>
          </g>
        </svg>
      </div>
      <div style="font-size: 12px; color: #8b95a1;">대안 - 축적을 은유</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="font-size: 11px; font-weight: 700; color: #8b95a1; letter-spacing: 0.08em;">안드로이드 레이어</div>
      <div style="display: flex; gap: 12px;">
        <div style="display: flex; flex-direction: column; gap: 6px; align-items: center;">
          <svg width="92" height="92" viewBox="0 0 108 108" style="border: 1px solid #f2f4f6; border-radius: 8px;">
            <rect x="0" y="0" width="108" height="108" fill="url(#gA)"/>
            <rect x="21" y="21" width="66" height="66" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="3 3" opacity="0.75"/>
          </svg>
          <div style="font-size: 10px; color: #b0b8c1;">배경 108dp</div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px; align-items: center;">
          <svg width="92" height="92" viewBox="0 0 108 108" style="border: 1px solid #f2f4f6; border-radius: 8px; background: #f9fafb;">
            <path d="M38 29h32a5 5 0 0 1 5 5v45.6a2.4 2.4 0 0 1-3.7 2l-15.6-9.9a3.2 3.2 0 0 0-3.4 0l-15.6 9.9a2.4 2.4 0 0 1-3.7-2V34a5 5 0 0 1 5-5z" fill="#3182f6"/>
            <rect x="21" y="21" width="66" height="66" fill="none" stroke="#f04452" stroke-width="1" stroke-dasharray="3 3"/>
          </svg>
          <div style="font-size: 10px; color: #b0b8c1;">전경 (66dp 안)</div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px; align-items: center;">
          <svg width="92" height="92" viewBox="0 0 108 108" style="border: 1px solid #f2f4f6; border-radius: 8px; background: #191f28;">
            <path d="M38 29h32a5 5 0 0 1 5 5v45.6a2.4 2.4 0 0 1-3.7 2l-15.6-9.9a3.2 3.2 0 0 0-3.4 0l-15.6 9.9a2.4 2.4 0 0 1-3.7-2V34a5 5 0 0 1 5-5z" fill="#ffffff"/>
          </svg>
          <div style="font-size: 10px; color: #b0b8c1;">모노크롬</div>
        </div>
      </div>
      <div style="font-size: 12px; color: #8b95a1; max-width: 300px; line-height: 1.5;">안드로이드 16부터는 모노크롬을 안 넣어도 시스템이 강제로 단색화합니다. 직접 그려야 결과를 통제할 수 있습니다.</div>
    </div>
  </div>

  <div style="display: flex; gap: 16px; align-items: center; padding: 16px; background: #f9fafb; border-radius: 12px;">
    <div style="font-size: 11px; font-weight: 700; color: #8b95a1; letter-spacing: 0.08em; white-space: nowrap;">작은 크기</div>
    <div style="display: flex; gap: 18px; align-items: flex-end;">
      <svg width="48" height="48" viewBox="0 0 108 108"><g clip-path="url(#mA)"><rect width="108" height="108" fill="url(#gA)"/><path d="M38 29h32a5 5 0 0 1 5 5v45.6a2.4 2.4 0 0 1-3.7 2l-15.6-9.9a3.2 3.2 0 0 0-3.4 0l-15.6 9.9a2.4 2.4 0 0 1-3.7-2V34a5 5 0 0 1 5-5z" fill="#fff"/></g></svg>
      <svg width="36" height="36" viewBox="0 0 108 108"><g clip-path="url(#mA)"><rect width="108" height="108" fill="url(#gA)"/><path d="M38 29h32a5 5 0 0 1 5 5v45.6a2.4 2.4 0 0 1-3.7 2l-15.6-9.9a3.2 3.2 0 0 0-3.4 0l-15.6 9.9a2.4 2.4 0 0 1-3.7-2V34a5 5 0 0 1 5-5z" fill="#fff"/></g></svg>
      <svg width="24" height="24" viewBox="0 0 108 108"><g clip-path="url(#mA)"><rect width="108" height="108" fill="url(#gA)"/><path d="M38 29h32a5 5 0 0 1 5 5v45.6a2.4 2.4 0 0 1-3.7 2l-15.6-9.9a3.2 3.2 0 0 0-3.4 0l-15.6 9.9a2.4 2.4 0 0 1-3.7-2V34a5 5 0 0 1 5-5z" fill="#fff"/></g></svg>
    </div>
    <div style="font-size: 12px; color: #8b95a1; line-height: 1.5;">48 / 36 / 24px에서도 형태가 뭉개지지 않습니다.</div>
  </div>

</div>
</x-dc>
</body>
</html>
