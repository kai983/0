<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; }
    a { color: #16181d; } a:hover { color: #000000; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #fcfcfd; display: flex; flex-direction: column; box-sizing: border-box;">

  <div style="padding: 8px 8px 8px 10px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e9eaec;">
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16181d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </div>
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6f7580" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5.5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="18.5" r="1.6"/></svg>
    </div>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 16px 16px 0;">

    <div style="font-size: 18px; font-weight: 700; color: #16181d; line-height: 1.45; letter-spacing: -0.01em;">뇌는 현실을 그대로 보지 않는다</div>

    <div style="margin-top: 14px; border: 1px solid #e9eaec; border-radius: 6px; overflow: hidden;">
      <div style="height: 36px; padding: 0 12px; display: flex; align-items: center; border-bottom: 1px solid #e9eaec;">
        <div style="width: 64px; font-size: 11px; font-weight: 600; color: #9aa0aa; letter-spacing: 0.06em;">출처</div>
        <div style="display: flex; align-items: center; gap: 6px;">
          <div style="width: 7px; height: 7px; border-radius: 999px; background: #c08a3e;"></div>
          <div style="font-size: 12px; color: #16181d;">유튜브 - 12분</div>
        </div>
      </div>
      <div style="height: 36px; padding: 0 12px; display: flex; align-items: center; border-bottom: 1px solid #e9eaec;">
        <div style="width: 64px; font-size: 11px; font-weight: 600; color: #9aa0aa; letter-spacing: 0.06em;">저장일</div>
        <div style="font-size: 12px; color: #16181d; font-variant-numeric: tabular-nums;">2026.09.01</div>
      </div>
      <div style="height: 36px; padding: 0 12px; display: flex; align-items: center;">
        <div style="width: 64px; font-size: 11px; font-weight: 600; color: #9aa0aa; letter-spacing: 0.06em;">태그</div>
        <div style="display: flex; gap: 5px;">
          <div style="padding: 2px 6px; border-radius: 4px; background: rgba(192, 138, 62, 0.1); color: #a3742f; font-size: 11px; font-weight: 500;">뇌과학</div>
          <div style="padding: 2px 6px; border-radius: 4px; background: #f0f1f3; color: #6f7580; font-size: 11px; font-weight: 500;">인지</div>
          <div style="padding: 2px 6px; border-radius: 4px; border: 1px dashed #d5d8dd; color: #9aa0aa; font-size: 11px; font-weight: 500;">+</div>
        </div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 6px; margin: 20px 0 10px;">
      <div style="width: 16px; height: 16px; border-radius: 4px; background: linear-gradient(135deg, #4593ff, #5b5ff0); display: flex; align-items: center; justify-content: center;">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#fff"><path d="M12 3l2.1 6.2L20 11l-5.9 1.8L12 19l-2.1-6.2L4 11l5.9-1.8z"/></svg>
      </div>
      <div style="font-size: 11px; font-weight: 700; color: #5b5ff0; letter-spacing: 0.06em;">AI 요약</div>
    </div>

    <div style="font-size: 15px; font-weight: 700; color: #16181d; line-height: 1.6; letter-spacing: -0.01em;">뇌는 카메라가 아니라, 생존에 유리하도록 감각을 미세하게 왜곡하는 예측 기계다.</div>

    <div style="font-size: 11px; font-weight: 600; color: #9aa0aa; letter-spacing: 0.06em; margin: 18px 0 8px;">핵심 내용</div>

    <div style="display: flex; flex-direction: column;">
      <div style="padding: 10px 0; border-bottom: 1px solid #e9eaec; display: flex; flex-direction: column; gap: 3px;">
        <div style="font-size: 13px; font-weight: 600; color: #16181d; line-height: 1.45;">뇌의 현실 왜곡</div>
        <div style="font-size: 14px; color: #40444c; line-height: 1.65;">모든 사람이 1~2%의 왜곡을 가지고 살아간다. 약간의 과장은 오히려 사회적 적응에 도움이 된다.</div>
      </div>
      <div style="padding: 10px 0; display: flex; flex-direction: column; gap: 3px;">
        <div style="font-size: 13px; font-weight: 600; color: #16181d; line-height: 1.45;">감각 오차 조절기</div>
        <div style="font-size: 14px; color: #40444c; line-height: 1.65;">노르에피네프린과 주의집중으로 조절된다. 위험 상황에서는 오차가 커도 일단 피하는 편이 생존에 유리하다.</div>
      </div>
    </div>

  </div>

  <div style="padding: 12px 16px 24px; border-top: 1px solid #e9eaec; background: #fcfcfd;">
    <div style="display: flex; gap: 8px;">
      <div style="flex: 1.4; height: 44px; border-radius: 6px; background: #16181d; color: #ffffff; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="14" height="13" rx="2.5"/><path d="M8 3h10a3 3 0 0 1 3 3v10"/></svg>
        학습 카드 만들기
      </div>
      <div style="flex: 1; height: 44px; border-radius: 6px; border: 1px solid #e9eaec; background: #ffffff; color: #40444c; font-size: 14px; font-weight: 500; display: flex; align-items: center; justify-content: center;">저장소로</div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
