<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; word-break: keep-all; }
    a { color: #3182f6; } a:hover { color: #1b64da; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #ffffff; display: flex; flex-direction: column; box-sizing: border-box; padding: 14px 20px 0;">

  <div style="display: flex; align-items: baseline; justify-content: space-between; padding-top: 12px;">
    <div style="font-size: 22px; font-weight: 700; color: #191f28; letter-spacing: -0.02em;">학습</div>
    <div style="font-size: 14px; font-weight: 600; color: #b0b8c1; font-variant-numeric: tabular-nums;">2 / 5</div>
  </div>

  <div style="height: 10px; border-radius: 999px; background: #eef1f4; overflow: hidden; margin: 16px 0 8px;">
    <div style="width: 20%; height: 100%; border-radius: 999px; background: #3182f6;"></div>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; padding: 26px 0 24px;">
    <div style="font-size: 11.5px; font-weight: 700; letter-spacing: 0.1em; color: #b0b8c1;">문제</div>
    <div style="margin-top: 12px; font-size: 22px; font-weight: 700; line-height: 1.55; letter-spacing: -0.02em; color: #191f28;">모니시 파브라이가 강조하는 초보 투자자가 지켜야 할 3가지 투자 원칙은 무엇인가요?</div>

    <div style="margin-top: 26px; padding-top: 22px; border-top: 1px solid #f2f4f6;">
      <div style="font-size: 11.5px; font-weight: 700; letter-spacing: 0.1em; color: #b0b8c1;">답</div>
      <div style="margin-top: 12px; font-size: 17px; line-height: 1.8; color: #191f28;">첫째 원금을 잃지 않을 것, 둘째 이해할 수 있는 사업에만 투자할 것, 셋째 충분한 안전마진을 확보할 것.</div>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 6px; padding-top: 8px; font-size: 12.5px; font-weight: 500; color: #b0b8c1;">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#b0b8c1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8a2 2 0 0 1 2 2v13.2a1 1 0 0 1-1.5.86L12 17.4l-4.5 2.66A1 1 0 0 1 6 19.2V6a2 2 0 0 1 2-2z"/></svg>
    <div style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">버핏에게 직접 배운 투자 원칙 3가지</div>
  </div>

  <div style="padding-top: 16px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;">
    <div style="min-height: 62px; border-radius: 14px; background: #fdeaec; color: #f04452; box-shadow: 0 4px 0 0 rgba(240,68,82,0.2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
      <div style="font-size: 15px; font-weight: 700;">다시</div>
      <div style="font-size: 11px; font-weight: 600; opacity: 0.7;">지금</div>
    </div>
    <div style="min-height: 62px; border-radius: 14px; background: #fbeedb; color: #d97706; box-shadow: 0 4px 0 0 rgba(217,119,6,0.2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
      <div style="font-size: 15px; font-weight: 700;">어려움</div>
      <div style="font-size: 11px; font-weight: 600; opacity: 0.7;">1일</div>
    </div>
    <div style="min-height: 62px; border-radius: 14px; background: #e2eefe; color: #3182f6; box-shadow: 0 4px 0 0 rgba(49,130,246,0.2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
      <div style="font-size: 15px; font-weight: 700;">좋음</div>
      <div style="font-size: 11px; font-weight: 600; opacity: 0.7;">3일</div>
    </div>
    <div style="min-height: 62px; border-radius: 14px; background: #daf3e6; color: #0f9f5c; box-shadow: 0 4px 0 0 rgba(15,159,92,0.2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
      <div style="font-size: 15px; font-weight: 700;">쉬움</div>
      <div style="font-size: 11px; font-weight: 600; opacity: 0.7;">6일</div>
    </div>
  </div>

  <div style="border-top: 1px solid #f2f4f6; margin: 18px -20px 0; padding: 10px 0 26px; display: flex;">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#b0b8c1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8a2 2 0 0 1 2 2v13.2a1 1 0 0 1-1.5.86L12 17.4l-4.5 2.66A1 1 0 0 1 6 19.2V6a2 2 0 0 1 2-2z"/></svg>
      <div style="font-size: 11px; font-weight: 500; color: #b0b8c1;">저장소</div>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3182f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="14" height="13" rx="2.5"/><path d="M8 3h10a3 3 0 0 1 3 3v10"/></svg>
      <div style="font-size: 11px; font-weight: 600; color: #3182f6;">학습</div>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#b0b8c1" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <div style="font-size: 11px; font-weight: 500; color: #b0b8c1;">새 지식</div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
