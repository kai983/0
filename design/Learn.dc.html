<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; }
    a { color: #3182f6; } a:hover { color: #1b64da; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #ffffff; display: flex; flex-direction: column; box-sizing: border-box;">

  <div style="padding: 14px 20px 12px; display: flex; align-items: center; justify-content: space-between;">
    <div style="font-size: 15px; font-weight: 700; color: #191f28;">학습</div>
    <div style="font-size: 14px; font-weight: 600; color: #8b95a1; font-variant-numeric: tabular-nums;">3 / 7</div>
  </div>

  <div style="padding: 0 20px 20px;">
    <div style="height: 4px; border-radius: 2px; background: #f2f4f6; overflow: hidden;">
      <div style="width: 43%; height: 100%; background: #3182f6; border-radius: 2px;"></div>
    </div>
  </div>

  <div style="flex: 1; padding: 0 20px; display: flex; flex-direction: column;">

    <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 16px;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#b0b8c1" stroke-width="2" stroke-linecap="round"><path d="M8 4h8a2 2 0 0 1 2 2v13.2a1 1 0 0 1-1.5.86L12 17.4l-4.5 2.66A1 1 0 0 1 6 19.2V6a2 2 0 0 1 2-2z"/></svg>
      <div style="font-size: 12px; font-weight: 600; color: #b0b8c1;">뇌는 현실을 그대로 보지 않는다</div>
    </div>

    <div style="font-size: 24px; font-weight: 700; color: #191f28; line-height: 1.45; letter-spacing: -0.03em;">감각 오차 조절기는 무엇으로 조절되는가?</div>

    <div style="margin-top: 24px; padding: 20px; background: #f9fafb; border-radius: 12px;">
      <div style="font-size: 12px; font-weight: 700; color: #8b95a1; letter-spacing: 0.04em; margin-bottom: 10px;">답</div>
      <div style="font-size: 17px; color: #333d4b; line-height: 1.7;">노르에피네프린과 주의집중. 위험 상황에서는 오차가 커도 일단 피하는 쪽이 생존에 유리하기 때문에 진화적으로 허용됐다.</div>
    </div>

  </div>

  <div style="padding: 20px; display: flex; flex-direction: column; gap: 10px;">
    <div style="font-size: 13px; color: #8b95a1; text-align: center;">얼마나 기억났나요?</div>
    <div style="display: flex; gap: 8px;">
      <div style="flex: 1; height: 56px; border-radius: 12px; background: #fff0f0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
        <div style="font-size: 15px; font-weight: 700; color: #f04452;">다시</div>
        <div style="font-size: 11px; color: #f0768a; font-variant-numeric: tabular-nums;">지금</div>
      </div>
      <div style="flex: 1; height: 56px; border-radius: 12px; background: #fff8ec; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
        <div style="font-size: 15px; font-weight: 700; color: #d97706;">어려움</div>
        <div style="font-size: 11px; color: #e0a355; font-variant-numeric: tabular-nums;">1일</div>
      </div>
      <div style="flex: 1; height: 56px; border-radius: 12px; background: #e8f3ff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
        <div style="font-size: 15px; font-weight: 700; color: #3182f6;">좋음</div>
        <div style="font-size: 11px; color: #6ba6f7; font-variant-numeric: tabular-nums;">3일</div>
      </div>
      <div style="flex: 1; height: 56px; border-radius: 12px; background: #e8f7ef; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
        <div style="font-size: 15px; font-weight: 700; color: #12b76a;">쉬움</div>
        <div style="font-size: 11px; color: #67c99b; font-variant-numeric: tabular-nums;">7일</div>
      </div>
    </div>
  </div>

  <div style="border-top: 1px solid #f2f4f6; padding: 10px 0 26px; display: flex;">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#b0b8c1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8a2 2 0 0 1 2 2v13.2a1 1 0 0 1-1.5.86L12 17.4l-4.5 2.66A1 1 0 0 1 6 19.2V6a2 2 0 0 1 2-2z"/></svg>
      <div style="font-size: 11px; font-weight: 600; color: #b0b8c1;">저장소</div>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3182f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="14" height="13" rx="2.5"/><path d="M8 3h10a3 3 0 0 1 3 3v10"/></svg>
      <div style="font-size: 11px; font-weight: 600; color: #3182f6;">학습</div>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#b0b8c1" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <div style="font-size: 11px; font-weight: 600; color: #b0b8c1;">새 지식</div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
