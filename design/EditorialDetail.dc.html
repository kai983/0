<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;900&amp;display=swap">
  <style>
    body { margin: 0; font-family: 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif; word-break: keep-all; }
    a { color: #b04a2f; } a:hover { color: #8f3a23; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #faf7f2; display: flex; flex-direction: column; box-sizing: border-box;">

  <div style="padding: 10px 12px 6px 16px; display: flex; align-items: center; justify-content: space-between;">
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#1f1b16" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </div>
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#6e675d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5.5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="18.5" r="1.6"/></svg>
    </div>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 10px 24px 0;">

    <div style="font-size: 11px; font-weight: 600; color: #6e675d; letter-spacing: 0.08em;">유튜브 - 12분 - 2026.09.01</div>
    <div style="font-family: 'Noto Serif KR', 'Apple SD Gothic Neo', serif; font-size: 24px; font-weight: 600; color: #1f1b16; line-height: 1.4; margin-top: 10px;">뇌는 현실을 그대로 보지 않는다</div>

    <div style="display: flex; gap: 6px; margin-top: 14px;">
      <div style="padding: 3px 9px; border: 1px solid #d8d1c5; border-radius: 4px; color: #6e675d; font-size: 12px; font-weight: 500;">뇌과학</div>
      <div style="padding: 3px 9px; border: 1px solid #d8d1c5; border-radius: 4px; color: #6e675d; font-size: 12px; font-weight: 500;">인지</div>
      <div style="padding: 3px 9px; border: 1px dashed #d8d1c5; border-radius: 4px; color: #a09a90; font-size: 12px; font-weight: 500;">+ 태그</div>
    </div>

    <div style="height: 1px; background: #e5dfd5; margin: 22px 0 18px;"></div>

    <div style="display: flex; align-items: center; gap: 7px; margin-bottom: 16px;">
      <div style="width: 18px; height: 18px; border-radius: 5px; background: linear-gradient(135deg, #4593ff, #5b5ff0); display: flex; align-items: center; justify-content: center;">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="#fff"><path d="M12 3l2.1 6.2L20 11l-5.9 1.8L12 19l-2.1-6.2L4 11l5.9-1.8z"/></svg>
      </div>
      <div style="font-size: 11px; font-weight: 700; color: #5b5ff0; letter-spacing: 0.08em;">AI 요약</div>
    </div>

    <div style="width: 24px; height: 2px; background: #b04a2f; margin-bottom: 12px;"></div>
    <div style="font-family: 'Noto Serif KR', 'Apple SD Gothic Neo', serif; font-size: 19px; font-weight: 600; color: #1f1b16; line-height: 1.75;">뇌는 카메라가 아니라, 생존에 유리하도록 감각을 미세하게 왜곡하는 예측 기계다.</div>

    <div style="font-size: 11px; font-weight: 700; color: #6e675d; letter-spacing: 0.12em; margin: 26px 0 12px;">핵심 내용</div>

    <div style="display: flex; flex-direction: column; gap: 16px;">
      <div style="display: flex; flex-direction: column; gap: 5px;">
        <div style="font-family: 'Noto Serif KR', 'Apple SD Gothic Neo', serif; font-size: 16px; font-weight: 600; color: #1f1b16; line-height: 1.5;">뇌의 현실 왜곡</div>
        <div style="font-family: 'Noto Serif KR', 'Apple SD Gothic Neo', serif; font-size: 16px; font-weight: 400; color: #3a352e; line-height: 1.8;">모든 사람이 1~2%의 왜곡을 가지고 살아간다. 약간의 과장은 오히려 사회적 적응에 도움이 된다.</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 5px;">
        <div style="font-family: 'Noto Serif KR', 'Apple SD Gothic Neo', serif; font-size: 16px; font-weight: 600; color: #1f1b16; line-height: 1.5;">감각 오차 조절기</div>
        <div style="font-family: 'Noto Serif KR', 'Apple SD Gothic Neo', serif; font-size: 16px; font-weight: 400; color: #3a352e; line-height: 1.8;">노르에피네프린과 주의집중으로 조절된다. 위험 상황에서는 오차가 커도 일단 피하는 편이 생존에 유리하다.</div>
      </div>
    </div>

  </div>

  <div style="padding: 14px 24px 26px; border-top: 1px solid #e5dfd5; background: #faf7f2;">
    <div style="display: flex; gap: 10px;">
      <div style="flex: 1.4; height: 52px; background: #1f1b16; color: #faf7f2; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 7px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#faf7f2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="14" height="13" rx="2.5"/><path d="M8 3h10a3 3 0 0 1 3 3v10"/></svg>
        학습 카드 만들기
      </div>
      <div style="flex: 1; height: 52px; border: 1px solid #d8d1c5; color: #3a352e; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center;">저장소로</div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
